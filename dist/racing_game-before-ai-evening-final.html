<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Arcade Racer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 800px;
            max-height: 600px;
            box-shadow: 0 0 20px rgba(255, 100, 0, 0.3);
            background: #111;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            z-index: 10;
        }
        .text-neon { color: #ffcc00; }
        
        /* Mobile Controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 20;
        }
        .control-group { display: flex; gap: 15px; }
        .touch-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 65px;
            height: 65px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .touch-btn:active, .touch-btn.active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }
        #btn-gas { background: rgba(255, 50, 50, 0.2); border-color: rgba(255, 50, 50, 0.5); }
        #btn-gas:active, #btn-gas.active { background: rgba(255, 50, 50, 0.6); }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
        }
        h1 { font-size: 3rem; color: #ff3300; margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 0 15px #ff3300; }
        .btn-start {
            background: #ff3300; color: #fff; border: none; padding: 15px 40px;
            font-size: 1.5rem; font-weight: bold; cursor: pointer; border-radius: 5px;
            box-shadow: 0 6px 0 #990000; transition: 0.1s; font-family: inherit;
        }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 2px 0 #990000; }
        .hidden { display: none !important; }
        
        @media (min-width: 800px) {
            #mobile-controls { display: none; } /* Hide touch controls on desktop */
            #hud { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="hud">
        <div>SCORE <span id="scoreVal" class="text-neon">0</span></div>
        <div><span id="speedVal" class="text-neon">0</span> MPH</div>
          <div>LAP <span id="lapVal" class="text-neon">1</span>/3</div>
    </div>

    <!-- Touch Controls -->
    <div id="mobile-controls">
        <div class="control-group">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
        <div class="control-group">
            <div class="touch-btn" id="btn-brake" style="font-size: 14px;">BRK</div>
            <div class="touch-btn" id="btn-gas" style="font-size: 14px;">GAS</div>
        </div>
    </div>

    <!-- Start / Game Over Screens -->
    <div id="screen-start" class="overlay">
        <h1>VIRTUAL RACER</h1>
        <p style="margin-bottom: 20px; color: #aaa;">Arrows/WASD to Drive</p>
        <button class="btn-start" onclick="startGame()">START ENGINE</button>
    </div>

    <div id="screen-gameover" class="overlay hidden">
          <h1>🏁 RACE COMPLETE!</h1>
          <h2 id="placeResult" class="text-neon">FINISHING...</h2>

          <p>TIME: <span id="finalTime">0</span></p>
          <p>LAPS: <span id="finalLaps">0</span>/3</p>
          <p>SCORE: <span id="finalScore" class="text-neon">0</span></p>

          <button class="btn-start" onclick="startGame()">RACE AGAIN</button>
      </div>
</div>

<script>


// LIVE MULTIPLAYER CONNECTION
let raceSocket = null;
let livePlayers = {};

function connectRaceSocket(){
    try {
        raceSocket = new WebSocket(
            location.origin.replace("http","ws")
        );

        raceSocket.onopen = ()=>{
            console.log("LIVE RACE CONNECTED");
        };

        raceSocket.onmessage = (event)=>{
            const data = JSON.parse(event.data);

            if(data.type === "race_state"){
                livePlayers = data.players || {};
            }
        };

        raceSocket.onclose = ()=>{
            console.log("LIVE RACE DISCONNECTED");
        };

    } catch(e){
        console.log("WS error", e);
    }
}

function sendRaceUpdate(){
    if(!raceSocket || raceSocket.readyState !== 1) return;

    raceSocket.send(JSON.stringify({
        type:"race_update",
        position:pos,
        speed:speed,
        wallet:wallet || "guest"
    }));
}

// MULTIPLAYER RACE SYSTEM
const MAX_PLAYERS = 8;

let racers = [
 {name:"YOU", position:0, speed:0, finished:false},
 {name:"Racer 2", position:0, speed:0, finished:false},
 {name:"Racer 3", position:0, speed:0, finished:false},
 {name:"Racer 4", position:0, speed:0, finished:false},
 {name:"Racer 5", position:0, speed:0, finished:false},
 {name:"Racer 6", position:0, speed:0, finished:false},
 {name:"Racer 7", position:0, speed:0, finished:false},
 {name:"Racer 8", position:0, speed:0, finished:false}
];

let raceResults=[];

function updateRacePositions(){
    racers.forEach((r,i)=>{
        if(!r.finished){
            if(i!==0){
                r.speed = 3 + Math.random()*3;
                r.position += r.speed;
            }
            if(r.position > 10000){
                r.finished=true;
                raceResults.push(r);
            }
        }
    });

    raceResults.sort((a,b)=>b.position-a.position);
}

function drawLeaderboard(){
    ctx.fillStyle="rgba(0,0,0,.5)";
    ctx.fillRect(10,80,220,220);

    ctx.fillStyle="#fff";
    ctx.font="18px Arial";

    racers.sort((a,b)=>b.position-a.position)
    .forEach((r,i)=>{
        ctx.fillText(
          (i+1)+". "+r.name,
          25,
          110+i*22
        );
    });
}


const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game Engine Config
const width = canvas.width;
const height = canvas.height;
const fps = 60;

// 3D Perspective Config
const fov = 350;
const camera_height = 80;
const horizon_y = 260;
const roadWidth = 1800;
const seg_len = 200;
const draw_distance = 40; // How many segments ahead to render



// RACE TRACK DATA
const raceTrack = [
 {type:"straight", length:10000},

 {type:"left", length:3500},
 {type:"straight", length:7000},

 {type:"right", length:4000},
 {type:"right", length:2500},

 {type:"straight", length:9000},

 {type:"left", length:4500},
 {type:"right", length:3500},

 {type:"hairpin", length:2200},

 {type:"straight", length:10000},

 {type:"right", length:4000},
 {type:"left", length:5000},

 {type:"straight", length:9000},

 {type:"hairpin", length:2500},

 {type:"straight", length:12000},

 {type:"left", length:3500},
 {type:"right", length:4000},

 {type:"straight", length:8000}
];

const trackLength = raceTrack.reduce((sum,part)=>sum+part.length,0);

function getTrackPart(distance){
    let d = distance % trackLength;

    for(let part of raceTrack){
        if(d <= part.length) return part;
        d -= part.length;
    }

    return raceTrack[0];
}

// Game State
let speed = 0;
let maxSpeed = 60;
let pos = 0; // Forward travel distance
let camera_x = 0; // Horizontal position (Steering)
let roadCurve = 0;
let score = 0;
let lap = 1;
let totalLaps = 3;
let lastLap = 0;
let raceStartTime = 0;
let raceFinishTime = 0;
let raceSubmitted = false;
let gameOver = false;
let shake = 0;

// Entities
let enemies = [];
const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

// Audio Context
let audioCtx;
let engineOsc;
let engineGain;

// Input Listeners (Keyboard)
window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

// Input Listeners (Touch / Mobile)
const bindTouch = (id, key) => {
    const btn = document.getElementById(id);
    const press = (e) => { e.preventDefault(); keys[key] = true; btn.classList.add('active'); };
    const release = (e) => { e.preventDefault(); keys[key] = false; btn.classList.remove('active'); };
    btn.addEventListener('touchstart', press); btn.addEventListener('touchend', release);
    btn.addEventListener('mousedown', press); btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
};
bindTouch('btn-left', 'ArrowLeft'); bindTouch('btn-right', 'ArrowRight');
bindTouch('btn-gas', 'ArrowUp'); bindTouch('btn-brake', 'ArrowDown');

// Initialize Web Audio API
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        engineOsc = audioCtx.createOscillator();
        engineGain = audioCtx.createGain();
        engineOsc.type = 'triangle';
        engineOsc.frequency.value = 40;
        engineOsc.connect(engineGain);
        engineGain.connect(audioCtx.destination);
        engineGain.gain.value = 0;
        engineOsc.start();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playCrash() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}


async function submitRaceScore(){
    if (raceSubmitted) return;
    raceSubmitted = true;

    const wallet = window.MONET_WALLET || localStorage.getItem("wallet_address") || "guest";

    try {
        const res = await fetch("/api/leaderboard/submit", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                wallet: wallet,
                game:"racing",
                score:score,
                laps: totalLaps,
                time: raceFinishTime - raceStartTime,
                finishedAt: new Date().toISOString()
            })
        });

        const data = await res.json();
        console.log("Race score submitted:", data);

    } catch(err){
        console.error("Race score submit failed:", err);
    }
}

// Start Game Reset
function startGame() {
    connectRaceSocket();
    initAudio();
    document.getElementById('screen-start').classList.add('hidden');
    document.getElementById('screen-gameover').classList.add('hidden');
    speed = 0; pos = 0; camera_x = 0; score = 0; enemies = []; gameOver = false; lap = 1; lastLap = 0; raceStartTime = Date.now(); raceFinishTime = 0; raceSubmitted = false; lap = 1; lastLap = 0;
    engineGain.gain.value = 0.05; // turn on engine sound
    requestAnimationFrame(gameLoop);
}

// Spawn Traffic
function spawnEnemy() {
    if (Math.random() < 0.015 && enemies.length < 4) {
        const lanes = [-roadWidth/3, 0, roadWidth/3]; // 3 Lanes
        enemies.push({
            world_x: lanes[Math.floor(Math.random() * lanes.length)],
            world_z: pos + (draw_distance * seg_len), // Spawn far away
            speed: Math.random() * 15 + 15, // Enemy speed
            color: `hsl(${Math.random() * 360}, 80%, 55%)`,
              type: ["sport","muscle","supercar"][Math.floor(Math.random()*3)]
        });
    }
}

// Main Update Logic
function update() {
if (gameOver) return;

if (keys.ArrowUp) {
    speed += 0.5;
} else if (keys.ArrowDown) {
    speed -= 1.5;
} else {
    speed -= 0.3;
}

speed = Math.max(0, Math.min(speed, maxSpeed));

pos += speed;

// Lap detection
if (Math.floor(pos / trackLength) > lastLap) {
    lastLap = Math.floor(pos / trackLength);

    if (lap >= totalLaps) {
        raceFinishTime = Date.now();

        racers[0].finished = true;
        racers[0].position = pos;
        raceResults.push(racers[0]);

        updateRacePositions();

        let place = raceResults.findIndex(r => r.name === "YOU") + 1;

        document.getElementById("placeResult").innerText =
            place === 1 ? "🥇 1st PLACE" :
            place === 2 ? "🥈 2nd PLACE" :
            place === 3 ? "🥉 3rd PLACE" :
            "🏁 " + place + "th PLACE";

        document.getElementById("finalScore").innerText = Math.floor(pos/10);

        let elapsed = (raceFinishTime - raceStartTime) / 1000;
        document.getElementById("finalTime").innerText = elapsed.toFixed(2) + "s";
        document.getElementById("finalLaps").innerText = totalLaps;

        submitRaceScore();

        gameOver = true;
        document.getElementById('screen-gameover').classList.remove('hidden');
    } else {
        lap++;
        console.log("LAP", lap);
    }
}

const trackPart = getTrackPart(pos);

let trackPull = 0;

if(trackPart.type === "left") trackPull = -2.0;
if(trackPart.type === "right") trackPull = 2.0;
if(trackPart.type === "hairpin") trackPull = 4.5;

camera_x += trackPull * (speed / 12);

let steerFactor = speed / maxSpeed;

if (keys.ArrowLeft)
    camera_x -= 35 * (0.5 + steerFactor);

if (keys.ArrowRight)
    camera_x += 35 * (0.5 + steerFactor);

if (Math.abs(camera_x) > roadWidth / 2) {
    speed -= 1.2;
}

camera_x = Math.max(
    -roadWidth * 0.9,
    Math.min(camera_x, roadWidth * 0.9)
);

spawnEnemy();

for (let i = enemies.length - 1; i >= 0; i--) {

    let e = enemies[i];
    e.world_z += e.speed;

    if (e.world_z < pos - 200) {
        enemies.splice(i, 1);
        score += 10;
        continue;
    }

    let dz = e.world_z - pos;

      // Protect finish line approach
      let nearFinish = (trackLength - (pos % trackLength)) < 1000;

    if (!nearFinish && dz > 0 && dz < 140) {
        if (Math.abs(e.world_x - camera_x) < 220) {
            shake = 30;
              playCrash();
              speed *= 0.55;
              e.world_z += 250;
              camera_x += (Math.random() > 0.5 ? 80 : -80);
              score = Math.max(0, score - 10);
        }
    }
}

if (engineOsc) {
    engineOsc.frequency.value = 40 + (speed * 1.8);
}

updateRacePositions();

racers[0].position = pos;
racers[0].speed = speed;

document.getElementById('speedVal').innerText =
    Math.floor(speed * 2.5);

document.getElementById('scoreVal').innerText =
    Math.floor(pos / 10);

  document.getElementById('lapVal').innerText = lap;

  // Send live race position
  sendRaceUpdate();

}


// Advanced 3D Car Renderer using Gradients
function drawCar(x, y, scale, color, isPlayer, type="sport") {
    let w = 260 * scale;
    let h = 130 * scale;

    // Floor Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.ellipse(x, y, w*0.45, h*0.2, 0, 0, Math.PI*2);
    ctx.fill();

    // Tires
    ctx.fillStyle = '#0a0a0a';
    let tw = w * 0.16; let th = h * 0.3;
    ctx.fillRect(x - w*0.4, y - th*0.8, tw, th); // Left
    ctx.fillRect(x + w*0.24, y - th*0.8, tw, th); // Right

    // Metallic Chassis Gradient
    let grad = ctx.createLinearGradient(x, y - h, x, y);
    grad.addColorStop(0, color);
    grad.addColorStop(0.5, color);
    grad.addColorStop(1, '#222');
    ctx.fillStyle = grad;

    // Body Polygon
    ctx.beginPath();
    ctx.moveTo(x - w*0.35, y - h*0.1);
    ctx.lineTo(x - w*0.45, y - h*0.4);
    ctx.lineTo(x - w*0.3, y - h*0.55); // Trunk
    ctx.lineTo(x - w*0.2, y - h*0.9);  // Roof
    ctx.lineTo(x + w*0.2, y - h*0.9);
    ctx.lineTo(x + w*0.3, y - h*0.55);
    ctx.lineTo(x + w*0.45, y - h*0.4);
    ctx.lineTo(x + w*0.35, y - h*0.1);
    ctx.closePath();
    ctx.fill();

    // Rear Windshield
    ctx.fillStyle = '#051525';
    ctx.beginPath();
    ctx.moveTo(x - w*0.25, y - h*0.55);
    ctx.lineTo(x - w*0.18, y - h*0.85);
    ctx.lineTo(x + w*0.18, y - h*0.85);
    ctx.lineTo(x + w*0.25, y - h*0.55);
    ctx.fill();
    
    // Glass Reflection
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.moveTo(x - w*0.05, y - h*0.55);
    ctx.lineTo(x, y - h*0.85);
    ctx.lineTo(x + w*0.18, y - h*0.85);
    ctx.lineTo(x + w*0.25, y - h*0.55);
    ctx.fill();

    // Braking / Taillights
    let isBraking = isPlayer && keys.ArrowDown;
    ctx.fillStyle = isBraking ? '#ff3333' : '#aa0000';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = isBraking ? 15 : 0;
    ctx.fillRect(x - w*0.4, y - h*0.35, w*0.2, h*0.12);
    ctx.fillRect(x + w*0.2, y - h*0.35, w*0.2, h*0.12);
    ctx.shadowBlur = 0; // Reset
    
    // License Plate
    ctx.fillStyle = '#eee';
    ctx.fillRect(x - w*0.12, y - h*0.3, w*0.24, h*0.1);

    // Upgrade: wheels with rims
    ctx.fillStyle = '#050505';
    ctx.beginPath();
    ctx.arc(x - w*0.34, y - h*0.05, w*0.09, 0, Math.PI*2);
    ctx.arc(x + w*0.34, y - h*0.05, w*0.09, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#aaa';
    ctx.beginPath();
    ctx.arc(x - w*0.34, y - h*0.05, w*0.035, 0, Math.PI*2);
    ctx.arc(x + w*0.34, y - h*0.05, w*0.035, 0, Math.PI*2);
    ctx.fill();

    // Headlights
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 12;
    ctx.fillRect(x - w*0.32, y - h*0.5, w*0.08, h*0.05);
    ctx.fillRect(x + w*0.24, y - h*0.5, w*0.08, h*0.05);
    ctx.shadowBlur = 0;

    // Vehicle type styling
    if(type === "muscle"){
        ctx.fillStyle = '#111';
        ctx.fillRect(x-w*0.25,y-h*0.92,w*0.5,h*0.06);
    }

    if(type === "supercar"){
        ctx.fillStyle = 'rgba(0,255,255,.5)';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 15;
        ctx.fillRect(x-w*0.35,y+h*0.05,w*0.7,h*0.04);
        ctx.shadowBlur = 0;
    }

    if(type === "sport"){
        ctx.fillStyle = '#222';
        ctx.fillRect(x-w*0.15,y-h*0.98,w*0.3,h*0.05);
    }
}

function drawBackground() {

    // Enhanced sky
    let sky = ctx.createLinearGradient(0,0,0,horizon_y);
    sky.addColorStop(0,'#020617');
    sky.addColorStop(.45,'#123b63');
    sky.addColorStop(1,'#ff7b39');
    ctx.fillStyle = sky;
    ctx.fillRect(0,0,width,horizon_y);


    // Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    let cloudOffset = -(camera_x * 0.03) % width;

    for(let i=0;i<5;i++){
        let cx = cloudOffset + i*260;
        let cy = 80 + (i%3)*35;

        ctx.beginPath();
        ctx.arc(cx,cy,35,0,Math.PI*2);
        ctx.arc(cx+35,cy+5,45,0,Math.PI*2);
        ctx.arc(cx+75,cy,30,0,Math.PI*2);
        ctx.fill();
    }


    // Sun glow
    let sunX = width/2 - camera_x*0.05;

    let glow = ctx.createRadialGradient(
        sunX,horizon_y-40,10,
        sunX,horizon_y-40,120
    );

    glow.addColorStop(0,'#fff4b0');
    glow.addColorStop(1,'rgba(255,180,0,0)');

    ctx.fillStyle = glow;
    ctx.fillRect(0,0,width,horizon_y);

    ctx.fillStyle='#ffd166';
    ctx.beginPath();
    ctx.arc(sunX,horizon_y-40,55,0,Math.PI*2);
    ctx.fill();



    // Layered mountains

    for(let layer=0; layer<3; layer++){

        ctx.fillStyle =
          layer===0 ? '#111827' :
          layer===1 ? '#1f2937' :
          '#374151';

        let offset = -((camera_x*(0.08+layer*.04))%500)-500;

        ctx.beginPath();

        for(let i=0;i<6;i++){

            let x=offset+i*500;

            ctx.moveTo(x,horizon_y);
            ctx.lineTo(x+120,horizon_y-80-layer*30);
            ctx.lineTo(x+250,horizon_y-10);
            ctx.lineTo(x+370,horizon_y-150-layer*20);
            ctx.lineTo(x+500,horizon_y);

        }

        ctx.fill();
    }
}

function draw() {
    // Handle Crash Screen Shake
    ctx.save();
    if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.9;
        if (shake < 0.5) shake = 0;
    }

    drawBackground();

    // 3D Road Projection Logic
    let start_seg = Math.floor(pos / seg_len);
    
    // Render Road back-to-front (Painter's Algorithm)
    for (let i = start_seg + draw_distance; i > start_seg; i--) {
        let z_far = i * seg_len - pos;
        let z_near = (i - 1) * seg_len - pos;

        if (z_near < 50) z_near = 50; // Near Clipping Plane
        if (z_far < 50) continue;

        // Perspective Scaling
        let scale_far = fov / z_far;
        let scale_near = fov / z_near;

        // Project Y (Height)
        let sy_far = horizon_y + (camera_height * scale_far);
        let sy_near = horizon_y + (camera_height * scale_near);

        // Project X (Width & Steering)
        let w_far = roadWidth * scale_far;
        let w_near = roadWidth * scale_near;
        let trackPart = getTrackPart(i * seg_len);

        let curve = 0;
        let turnProgress = (i * seg_len % trackPart.length) / trackPart.length;
          let smooth = Math.sin(turnProgress * Math.PI);

          if(trackPart.type === "left") curve = -450 * smooth;
        if(trackPart.type === "right") curve = 450 * smooth;
        if(trackPart.type === "hairpin") curve = 900 * smooth;

        let sx_far = width / 2 - (camera_x * scale_far) + (curve * scale_far);
        let sx_near = width / 2 - (camera_x * scale_near) + (curve * scale_near);

        let colorIdx = i % 2; // Alternating segments for speed illusion

// Start / Finish Line
let segmentDistance = i * seg_len;

if (segmentDistance % trackLength < seg_len) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(
        sx_near - w_near/2,
        sy_near - 10,
        w_near,
        10
    );
}

        // Grass
        ctx.fillStyle = colorIdx ? '#1d5e16' : '#24701d';
        ctx.fillRect(0, sy_far, width, sy_near - sy_far + 1);

        // Main Asphalt
        ctx.fillStyle = colorIdx ? '#333' : '#3d3d3d';
        ctx.beginPath();
        ctx.moveTo(sx_far - w_far/2, sy_far); ctx.lineTo(sx_far + w_far/2, sy_far);
        ctx.lineTo(sx_near + w_near/2, sy_near); ctx.lineTo(sx_near - w_near/2, sy_near);
        ctx.fill();

        // Rumble Strips (Red & White)
        let rw_far = 120 * scale_far; let rw_near = 120 * scale_near;
        ctx.fillStyle = colorIdx ? '#eee' : '#cc0000';
        
        // Left Strip
        ctx.beginPath();
        ctx.moveTo(sx_far - w_far/2 - rw_far, sy_far); ctx.lineTo(sx_far - w_far/2, sy_far);
        ctx.lineTo(sx_near - w_near/2, sy_near); ctx.lineTo(sx_near - w_near/2 - rw_near, sy_near);
        ctx.fill();
        
        // Right Strip
        ctx.beginPath();
        ctx.moveTo(sx_far + w_far/2, sy_far); ctx.lineTo(sx_far + w_far/2 + rw_far, sy_far);
        ctx.lineTo(sx_near + w_near/2 + rw_near, sy_near); ctx.lineTo(sx_near + w_near/2, sy_near);
        ctx.fill();

        // Dotted Lane Dividers
        if (colorIdx) {
            ctx.fillStyle = '#fff';
            let lw_far = 25 * scale_far; let lw_near = 25 * scale_near;
            for (let lane = -1; lane <= 1; lane += 2) {
                let lx_far = sx_far + (w_far / 6) * lane;
                let lx_near = sx_near + (w_near / 6) * lane;
                ctx.beginPath();
                ctx.moveTo(lx_far - lw_far/2, sy_far); ctx.lineTo(lx_far + lw_far/2, sy_far);
                ctx.lineTo(lx_near + lw_near/2, sy_near); ctx.lineTo(lx_near - lw_near/2, sy_near);
                ctx.fill();
            }
        }
    }

    // Render Enemies
    let visibleEnemies = enemies.filter(e => e.world_z > pos && e.world_z < pos + (draw_distance * seg_len));
    visibleEnemies.sort((a, b) => b.world_z - a.world_z); // Sort Z for Painter's Alg

    for (let e of visibleEnemies) {
        let dz = e.world_z - pos;
        let scale = fov / dz;
        let sx = width / 2 + ((e.world_x - camera_x) * scale);
        let sy = horizon_y + (camera_height * scale);
        drawCar(sx, sy, scale, e.color, false, e.type);
    }

    // Render Player (Anchored at bottom center plane)
    if (!gameOver || Math.floor(Date.now() / 200) % 2 === 0) { // Blink if dead
        let p_scale = fov / 100; // Near plane Z
        let p_sy = horizon_y + (camera_height * p_scale);
        // First person mode: player car hidden
    }

    ctx.restore(); // Restore context if it was shaken
}

// Game Loop
function gameLoop() {
    update();
    draw();
    if (!gameOver || shake > 0) requestAnimationFrame(gameLoop);
}

// Initial draw behind the start screen
drawBackground();
</script>
</body>
