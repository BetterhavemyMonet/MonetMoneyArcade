<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MonetMoney Sprite Racer</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #222; overflow: hidden; font-family: 'Courier New', Courier, monospace; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-size: 18px; font-weight: bold; pointer-events: none; text-shadow: 2px 2px 0 #000; }
        #message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #FFD700; font-size: 32px; font-weight: bold; text-align: center; text-shadow: 3px 3px 0 #000; pointer-events: none; display: none; }
        #controls { position: absolute; bottom: 20px; width: 100%; text-align: center; color: rgba(255, 255, 255, 0.5); font-size: 14px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="ui">
        <div>LAP: <span id="lap">1</span> / 3</div>
        <div>POS: <span id="pos">1</span> / 4</div>
        <div>TIME: <span id="time">0.00</span></div>
    </div>
    <div id="message"></div>
    <div id="controls">Desktop: Arrow Keys | Mobile: Tap Left/Right to Steer</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Resize canvas
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        // --- IMAGE LOADING ---
        // We embed the generated spritesheet as a base64 string for zero external dependencies.
        const spriteSheet = new Image();
        spriteSheet.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAlgAAACgCAYAAABv548OAAAAAXNSR0IArs4c6QAAAHhlWElmTU0AKgAAAAgABAEaAAUAAAABAAAAPgEbAAUAAAABAAAARgExAAIAAAAhAAAATgEyAAIAAAAUAAAAcIdpAAQAAAABAAAAhAAAAAAAAABIAAAAAQAAAEgAAAABMjAyNDowNToyMiAxNTo1MDowNAAAB6ABAAMAAAAB//8AAKACAAQAAAABAAACWKADAAQAAAABAAAAoAAAAACKY04oAAAACXBIWXMAAAsTAAALEwEAmpwYAAAFn0lEQVR4Ae3dP0sjQRQH4PHeIogiWliIdorYaSXYqKUl/gFbW6X4AWxtrSxCkEIrwU60sRBtREURUbSRIOr48v7AnZmdjXv3Zt8W9h4QmFtm3rMzs7OzK6l6vV4v+EGAAAECBAgQIEDguwI7v69SBAIECBAgQIAAAQJxAaxEAAAAAQIECBAgkBAALwsBAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEAJYCAAAAAQIECCQEfl4u+u6bHofD974795b5+z/v4V64V94XvP77vD7eZ/mFz67T9mB/r9W/VpUfBAgQIECAAAECPxF49vH08+O7X5vP+w6f/9536TOfv7Xv2n7at30v+Xn39YfPr9XmK45v8Y7Zp+453Y//4j6X7VdfX/5Z7vP5Nq8/fN/z4mPf8y6/8Pmue/lrfZfX5vX5K/y3vL7wGfc+7/V5r/vV8m+f24+8X7X+wmu553L5i/3tM3/iN45v8b7X9VzXw/V5Lf/wZ99z+f7m9YXXFp/L99/33OdfvO63P9/1//P8u/6X11ffn+/54X7v3z8/93O912//4b7wWv4Kj5b35/X5rL/wWb5/4XP7lP35PvdYfu8/Z/9u+W8P7w3X5/Zwfbiu56vV1+/7wvcH/X6r9Vff9z89Hw8f3z4Xv/N9+z/vs3Sve7+Xv7f38NqX7qW7vNff9//w/dfy3X3K+XUeW/p+S6/5zPeX45vHw+PlG99fjG/+i6vPue/786v3f+7w//HwWvep+93/ffZ/f+99Xl99X28PPvevXf73w3vp/bWvv45tVfX5F+4PPv/x/Y/v4brX+r6/5pZ+2/mrf15f8Xn49/L+XqffVvj33v/Hw2tdH3/P923ff/2z9bH999v7j/5a/y+9ltvn+/XfH8YFv5bX8l94ffwre//8D+/hffv7r/vN8u//f/P75/5v7zPe69O+G76f57H8vXz++b6W1+vnef9P++7/m9//h//b9357X58v/P/P70vXN3//3L9+/3Pf+/L6wuf56X/7/Z631275Wv6u5e/2nreX11ffx9/Ldf9939/5vu0vfvf3Pe9T97bPPu9Xy2t9X8uffS9/t/vF769v//88X3xf+89+v2t+u3+/PZbf+4/h73L6G/+n59z+Xv5+/D5f+P7bW/6O9+M1D/9fr/+559b6+vxf7v3WvX7P+8N1+Xp7fL28vvi9vb+eG757bPm78N/r2r9XfV5f//7tZ/7w/vA+fX9//9zHfvG1b//Xf4n4bWkAAAAAElFTkSuQmCC';

        // --- GAME DEFINITIONS ---
        const state = { laps: 3, startTime: 0, elapsedTime: 0, playing: true, finished: false };
        const track = { x: canvas.width / 2, y: canvas.height / 2, outerRadius: Math.min(canvas.width, canvas.height) * 0.45, innerRadius: Math.min(canvas.width, canvas.height) * 0.25 };

        // Define Car Types with specific sprite locations (x on spritesheet) and physics
        const CAR_TYPES = {
            super: { sx: 0,   w: 152, h: 160, maxSpd: 0.052, acc: 0.0012, frict: 0.96 }, // Red
            tuner: { sx: 152, w: 152, h: 160, maxSpd: 0.048, acc: 0.0010, frict: 0.95 }, // Blue
            truck: { sx: 304, w: 152, h: 160, maxSpd: 0.042, acc: 0.0009, frict: 0.97 }, // Green
            proto: { sx: 456, w: 152, h: 160, maxSpd: 0.055, acc: 0.0015, frict: 0.94 }  // Grey
        };

        // --- INPUT HANDLING ---
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
        window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });
        window.addEventListener('touchstart', e => { 
            const touchX = e.touches[0].clientX;
            keys.ArrowUp = true; 
            if (touchX < canvas.width / 2) { keys.ArrowLeft = true; keys.ArrowRight = false; }
            else { keys.ArrowRight = true; keys.ArrowLeft = false; }
        });
        window.addEventListener('touchend', () => { keys.ArrowLeft = false; keys.ArrowRight = false; keys.ArrowUp = false; });

        // --- CAR CLASS ---
        class Car {
            constructor(type, isPlayer, startAngle) {
                this.type = type;
                this.isPlayer = isPlayer;
                this.angle = startAngle;
                this.distanceFromCenter = (track.outerRadius + track.innerRadius) / 2 + (isPlayer ? 20 : -20);
                this.speed = 0;
                this.lap = 1;
                this.progress = 0; 
                this.lastAngle = startAngle;
            }

            update() {
                if (!state.playing) return;
                const stats = CAR_TYPES[this.type];

                if (this.isPlayer) {
                    if (keys.ArrowUp) this.speed += stats.acc;
                    if (keys.ArrowDown) this.speed -= stats.acc;
                    if (keys.ArrowLeft) this.distanceFromCenter -= 3;
                    if (keys.ArrowRight) this.distanceFromCenter += 3;
                } else {
                    this.speed += stats.acc * (0.9 + Math.random() * 0.2); // Add slight randomness to AI
                    this.distanceFromCenter += Math.sin(Date.now() / 1000 + stats.maxSpd) * 0.5; 
                }

                this.speed *= stats.frict;
                if (this.speed > stats.maxSpd) this.speed = stats.maxSpd;

                this.angle += this.speed;

                // Track boundaries
                if (this.distanceFromCenter > track.outerRadius - 25) { this.distanceFromCenter = track.outerRadius - 25; this.speed *= 0.9; }
                if (this.distanceFromCenter < track.innerRadius + 25) { this.distanceFromCenter = track.innerRadius + 25; this.speed *= 0.9; }

                // Lap Counter
                let angleDiff = this.angle - this.lastAngle;
                if (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                if (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                this.progress += angleDiff;
                this.lastAngle = this.angle % (Math.PI * 2);
                let currentLap = Math.floor(this.progress / (Math.PI * 2)) + 1;
                if (currentLap > this.lap && this.isPlayer && currentLap <= state.laps) {
                    this.lap = currentLap; document.getElementById('lap').innerText = this.lap;
                }

                // Win condition
                if (currentLap > state.laps && this.isPlayer && !state.finished) {
                    state.finished = true; state.playing = false;
                    let position = calculatePositions().findIndex(c => c === this) + 1;
                    showEndScreen(position);
                }
            }

            draw() {
                const stats = CAR_TYPES[this.type];
                const x = track.x + Math.cos(this.angle) * this.distanceFromCenter;
                const y = track.y + Math.sin(this.angle) * this.distanceFromCenter;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(this.angle + Math.PI / 2);
                
                // Draw Sprite from spritesheet
                // sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight
                ctx.drawImage(spriteSheet, stats.sx, 0, stats.w, stats.h, -20, -25, 40, 50);
                ctx.restore();
            }
        }

        // --- GAME LOOP & UTIL ---
        const cars = [
            new Car('super', true, 0),      // Player
            new Car('tuner', false, -0.15), // AI 1
            new Car('truck', false, -0.3),  // AI 2
            new Car('proto', false, -0.45)  // AI 3
        ];

        function calculatePositions() { return [...cars].sort((a, b) => b.progress - a.progress); }

        function drawTrack() {
            ctx.fillStyle = '#2c5e1a'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Grass
            ctx.beginPath(); ctx.arc(track.x, track.y, track.outerRadius, 0, Math.PI * 2); ctx.fillStyle = '#444'; ctx.fill(); // Road
            ctx.beginPath(); ctx.arc(track.x, track.y, track.innerRadius, 0, Math.PI * 2); ctx.fillStyle = '#2c5e1a'; ctx.fill(); // Inner Grass
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.setLineDash([20, 20]);
            ctx.beginPath(); ctx.arc(track.x, track.y, (track.outerRadius + track.innerRadius)/2, 0, Math.PI * 2); ctx.stroke(); // Lane Marker
            ctx.setLineDash([]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 10;
            ctx.beginPath(); ctx.moveTo(track.x + track.innerRadius, track.y); ctx.lineTo(track.x + track.outerRadius, track.y); ctx.stroke(); // Finish
        }

        function showEndScreen(position) {
            const msgBox = document.getElementById('message');
            let text = position === 1 ? "🏆 1ST PLACE!" : (position === 2 ? "🥈 2ND PLACE!" : (position === 3 ? "🥉 3RD PLACE!" : "4TH PLACE"));
            msgBox.innerHTML = `${text}<br><br><span style="font-size:20px; cursor:pointer;" onclick="location.reload()">Tap to Restart</span>`;
            msgBox.style.display = 'block'; msgBox.style.pointerEvents = 'auto';
        }

        function loop() {
            if (state.startTime === 0 && (keys.ArrowUp || keys.ArrowLeft || keys.ArrowRight)) state.startTime = Date.now();
            drawTrack();
            cars.forEach(car => { car.update(); car.draw(); });
            if (state.playing && state.startTime !== 0) document.getElementById('time').innerText = ((Date.now() - state.startTime) / 1000).toFixed(2);
            let playerPos = calculatePositions().findIndex(c => c.isPlayer) + 1;
            document.getElementById('pos').innerText = playerPos;
            requestAnimationFrame(loop);
        }

        // Start when image loads
        spriteSheet.onload = () => { loop(); };
    </script>

<script>
(() => {
function getPlayer(){return window.player||window.dino||window.hero;}
function getPlatforms(){return window.platforms||window.ground||[];}

function fix(){
  const p=getPlayer();
  const plats=getPlatforms();
  if(!p||!plats.length)return;

  const h=p.height||p.displayHeight||50;

  for(let i=0;i<plats.length;i++){
    const pl=plats[i];
    const py=pl.y??0;
    const px=pl.x??0;
    const pw=pl.width??9999;

    if(p.x+20>px && p.x<px+pw && p.y+h>=py && p.y+h<=py+30){
      p.y=py-h;
      p.velocityY=0;
      p.onGround=true;
    }
  }
}

function loop(){
  try{fix();}catch(e){}
  requestAnimationFrame(loop);
}

window.addEventListener("load",loop);
})();
</script>


<script>
(() => {
  const MonetRuntime = {
    tickRate: 2000,

    start() {
      setInterval(() => this.tick(), this.tickRate);
    },

    tick() {
      const player = window.player || window.dino || window.hero;

      if (!player) return;

      // -------------------------
      // PHYSICS SELF-HEAL
      // -------------------------
      const groundY = window.groundY || 0;
      const bottom = player.y + (player.height || 50);

      if (bottom > groundY + 20) {
        player.y = groundY - (player.height || 50);
        player.velocityY = 0;
        player.onGround = true;
      }

      // -------------------------
      // LEVEL SANITY CHECK
      // -------------------------
      if (window.MonetArcade?.state) {
        const s = window.MonetArcade.state;

        if (s.level < 1) s.level = 1;
        if (s.spawnRate < 100) s.spawnRate = 1000;
        if (isNaN(s.score)) s.score = 0;
      }

      // -------------------------
      // SPAWN SAFETY CHECK
      // -------------------------
      if (window.spawnObstacle && !window.__spawnSafe) {
        window.__spawnSafe = true;
      }
    }
  };

  window.MonetRuntime = MonetRuntime;
  window.addEventListener("load", () => MonetRuntime.start());
})();
</script>


<script id='MONET_RUNTIME_V4'>
(() => {
  const MONET_RUNTIME = {
    version: "4.0.0",

    state: {
      tick: 0,
      lastFix: 0
    },

    tickRate: 1500,

    start() {
      setInterval(() => this.tick(), this.tickRate);
    },

    tick() {
      this.state.tick++;

      const player = window.player || window.dino || window.hero;
      const arcade = window.MonetArcade?.state;

      // =========================
      // 1. PHYSICS REPAIR LAYER
      // =========================
      if (player) {
        const groundY = window.groundY || 0;
        const h = player.height || 50;
        const bottom = player.y + h;

        if (bottom > groundY + 20) {
          player.y = groundY - h;
          player.velocityY = 0;
          player.onGround = true;
          this.state.lastFix = Date.now();
        }
      }

      // =========================
      // 2. GAME STATE SANITIZER
      // =========================
      if (arcade) {
        if (!Number.isFinite(arcade.level)) arcade.level = 1;
        if (!Number.isFinite(arcade.score)) arcade.score = 0;
        if (!Number.isFinite(arcade.spawnRate)) arcade.spawnRate = 1000;

        // prevent Level 3-style lockups
        if (arcade.level < 1) arcade.level = 1;
        if (arcade.spawnRate < 200) arcade.spawnRate = 200;
      }

      // =========================
      // 3. SPAWN SAFETY GATE
      // =========================
      if (typeof window.spawnObstacle === "function") {
        window.__spawnSafe = true;
      }

      // =========================
      // 4. STABILITY WATCHDOG
      // =========================
      if (this.state.tick % 10 === 0) {
        this.healthCheck();
      }
    },

    healthCheck() {
      const player = window.player || window.dino;

      if (!player) return;

      // detect stuck state
      if (player.velocityY === 0 && player.onGround === false) {
        player.onGround = true;
      }
    }
  };

  window.MonetRuntime = MONET_RUNTIME;

  window.addEventListener("load", () => {
    MONET_RUNTIME.start();
  });
})();
</script>


<script id="MONET_TRANSCEND_V5">
(() => {
  const KernelBridge = {
    sync() {
      const arcade = window.MonetArcade?.state;
      if (!arcade) return;

      // register into kernel bridge
      window.__MONET_KERNEL_STATE = arcade;
    },

    fixPhysics() {
      const p = window.player || window.dino || window.hero;
      if (!p) return;

      const groundY = window.groundY || 0;
      const h = p.height || 50;

      const bottom = p.y + h;

      if (bottom > groundY + 20) {
        p.y = groundY - h;
        p.velocityY = 0;
        p.onGround = true;
      }
    },

    stabilizeGame() {
      const s = window.MonetArcade?.state;
      if (!s) return;

      if (!Number.isFinite(s.level)) s.level = 1;
      if (!Number.isFinite(s.score)) s.score = 0;

      // transcend rule: no unstable progression states
      if (s.level < 1) s.level = 1;
    }
  };

  function loop() {
    try {
      KernelBridge.sync();
      KernelBridge.fixPhysics();
      KernelBridge.stabilizeGame();
    } catch (e) {}

    requestAnimationFrame(loop);
  }

  window.addEventListener("load", loop);
})();
</script>


<script id="MONET_OS_V6">
(() => {

  const Runtime = {
    tick() {
      const player = window.player || window.dino || window.hero;
      const state = window.MonetArcade?.state;

      // -------------------------
      // PHYSICS CORRECTION
      // -------------------------
      if (player) {
        const ground = window.groundY || 0;
        const h = player.height || 50;

        if (player.y + h > ground + 20) {
          player.y = ground - h;
          player.velocityY = 0;
          player.onGround = true;
        }
      }

      // -------------------------
      // STATE SANITIZATION
      // -------------------------
      if (state) {
        if (!Number.isFinite(state.level)) state.level = 1;
        if (!Number.isFinite(state.score)) state.score = 0;
        if (!Number.isFinite(state.spawnRate)) state.spawnRate = 1000;

        if (state.level < 1) state.level = 1;
      }

      // -------------------------
      // SAFE HOOK GUARD
      // -------------------------
      if (typeof window.spawnObstacle === "function") {
        window.__MONET_SAFE = true;
      }
    }
  };

  function loop() {
    try { Runtime.tick(); } catch (e) {}
    requestAnimationFrame(loop);
  }

  window.addEventListener("load", loop);
})();
</script>
