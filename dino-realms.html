<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dino Realms | Monet Money Arcade</title>

<script src="/wallet.js"></script>
<script src="https://api.betterhavemymonet.com/levels.js"></script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020409;
  font-family:Orbitron,Arial,sans-serif;
}
canvas{
  display:block;
  margin:auto;
}
#mobileControls{
  position:fixed;
  left:0;
  right:0;
  bottom:max(18px, env(safe-area-inset-bottom));
  z-index:200;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  padding:0 22px;
  pointer-events:none;
}

.controlCluster{
  display:flex;
  gap:14px;
}

.gameControl{
  width:72px;
  height:72px;
  border-radius:50%;
  border:2px solid rgba(0,255,200,.9);
  background:rgba(0,0,0,.62);
  color:#fff;
  font-size:30px;
  font-weight:900;
  box-shadow:
    0 0 14px rgba(0,255,200,.55),
    inset 0 0 14px rgba(0,255,200,.18);
  pointer-events:auto;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.gameControl:active{
  transform:scale(.92);
  background:rgba(0,255,200,.32);
}

#jumpBtn{
  width:82px;
  height:82px;
  border-color:#ffd700;
  box-shadow:
    0 0 16px rgba(255,215,0,.6),
    inset 0 0 14px rgba(255,215,0,.18);
}

@media (min-width:900px) and (pointer:fine){
  #mobileControls{
    opacity:.42;
  }
}

#realmBanner{
  position:fixed;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  color:white;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 0 12px #00ffc8;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="realmBanner">DINO REALMS</div>

<div id="mobileControls">
  <div class="controlCluster">
    <button id="leftBtn" class="gameControl" aria-label="Move left">◀</button>
    <button id="rightBtn" class="gameControl" aria-label="Move right">▶</button>
  </div>

  <button id="jumpBtn" class="gameControl" aria-label="Jump">▲</button>
</div>

<script>
let player;
let cursors;
let platforms;
let enemies;
let coins;
let portal;

let realm = 0;
let realmCoins = 0;
let score = 0;
let health = 5;
let gameOver = false;

const touchControls = {
  left:false,
  right:false,
  jump:false
};

function bindTouchControls(){

  const bind = (id,key)=>{
    const el=document.getElementById(id);
    if(!el) return;

    const down=(ev)=>{
      ev.preventDefault();
      touchControls[key]=true;
    };

    const up=(ev)=>{
      ev.preventDefault();
      touchControls[key]=false;
    };

    el.onpointerdown=down;
    el.onpointerup=up;
    el.onpointercancel=up;
    el.onpointerleave=up;
    el.oncontextmenu=(ev)=>ev.preventDefault();
  };

  bind('leftBtn','left');
  bind('rightBtn','right');
  bind('jumpBtn','jump');
}

const REALMS = [
  {
    name:'EMERALD JUNGLE',
    bg:'bg-jungle',
    file:'/assets/bg-emerald-jungle.png',
    tint:0x22cc77,
    enemySpeed:70
  },
  {
    name:'CRYSTAL VALLEY',
    bg:'bg-crystal',
    file:'/assets/bg-crystal-valley.png',
    tint:0x47d7ff,
    enemySpeed:85
  },
  {
    name:'FROZEN PEAKS',
    bg:'bg-frozen',
    file:'/assets/bg-frozen-peaks.png',
    tint:0xaeefff,
    enemySpeed:100
  },
  {
    name:'MAGMA DEPTHS',
    bg:'bg-magma',
    file:'/assets/bg-magma-depths.png',
    tint:0xff6633,
    enemySpeed:115
  },
  {
    name:'PORTAL CITADEL',
    bg:'bg-citadel',
    file:'/assets/bg-portal-citadel.png',
    tint:0xbc66ff,
    enemySpeed:130
  }
];

const config = {
  type: Phaser.AUTO,
  width: 960,
  height: 540,
  scale:{
    mode:Phaser.Scale.FIT,
    autoCenter:Phaser.Scale.CENTER_BOTH
  },
  physics:{
    default:'arcade',
    arcade:{
      gravity:{y:1100},
      debug:false
    }
  },
  scene:{
    preload,
    create,
    update
  }
};

new Phaser.Game(config);

function preload(){
  this.load.image('dino','/dino-sprite.png');
  this.load.image('enemy','/silverback.png');

  REALMS.forEach(r=>{
    this.load.image(r.bg,r.file);
  });
}

function create(){

  this.physics.world.setBounds(0,0,5000,540);
  this.cameras.main.setBounds(0,0,5000,540);

  cursors = this.input.keyboard.createCursorKeys();
  bindTouchControls();

  platforms = this.physics.add.staticGroup();
  enemies = this.physics.add.group();
  coins = this.physics.add.group({
    allowGravity:false,
    immovable:true
  });

  buildRealm.call(this);

  player = this.physics.add.sprite(120,390,'dino');

  player.setScale(.28);
  player.setCollideWorldBounds(true);
  player.setBounce(0.05);

  this.physics.add.collider(player,platforms);
  this.physics.add.collider(enemies,platforms);

  this.physics.add.overlap(player,coins,collectCoin,null,this);
  this.physics.add.overlap(player,enemies,hitEnemy,null,this);
  this.physics.add.overlap(player,portal,enterPortal,null,this);

  this.cameras.main.startFollow(player,true,.09,.09);
}

function buildRealm(){

  const r = REALMS[realm];

  document.getElementById('realmBanner').textContent =
    `REALM ${realm+1}/5 • ${r.name}`;

  // Clear only realm objects. Do NOT destroy the whole Phaser scene.
  if (this.realmBackground) {
    this.realmBackground.destroy();
    this.realmBackground = null;
  }

  platforms.clear(true,true);
  enemies.clear(true,true);
  coins.clear(true,true);

  const bg = this.add.image(0,0,r.bg)
    .setOrigin(0,0)
    .setDisplaySize(5000,540)
    .setScrollFactor(0.15);

  bg.setDepth(-20);
  this.realmBackground = bg;

  // Main ground
  for(let x=100;x<5000;x+=220){
    const p=this.add.rectangle(
      x,
      500,
      230,
      80,
      realm===3 ? 0x51200f : 0x193d31
    );

    this.physics.add.existing(p,true);
    platforms.add(p);
  }

  // Varied platform layout per realm
  const layouts = [

    [
      [500,390],[850,320],[1200,385],[1600,285],
      [2050,370],[2450,270],[2900,350],[3400,250],
      [3850,340],[4300,280]
    ],

    [
      [450,360],[900,250],[1350,355],[1750,220],
      [2150,330],[2600,210],[3000,350],[3450,250],
      [3900,180],[4400,330]
    ],

    [
      [400,400],[800,300],[1200,200],[1600,310],
      [2050,180],[2450,290],[2850,150],[3350,320],
      [3800,210],[4250,120]
    ],

    [
      [480,350],[820,240],[1180,360],[1550,190],
      [1950,330],[2350,165],[2750,310],[3150,190],
      [3600,350],[4100,220],[4550,140]
    ],

    [
      [420,375],[760,280],[1080,190],[1450,290],
      [1800,160],[2200,260],[2550,140],[2950,250],
      [3350,120],[3750,230],[4150,145],[4550,250]
    ]
  ];

  layouts[realm].forEach(([x,y],i)=>{

    const width = 190 + ((i%3)*45);

    const p = this.add.rectangle(
      x,
      y,
      width,
      22,
      r.tint
    );

    p.setAlpha(.9);

    this.physics.add.existing(p,true);
    platforms.add(p);
  });

  realmCoins = 0;

  // Coins
  for(let i=0;i<15;i++){

    const x = 380 + i*285;
    const y = 180 + ((i*77)%210);

    const c=this.add.circle(x,y,10,0xffdd22);

    this.physics.add.existing(c);

    c.body.setAllowGravity(false);
    c.body.setCircle(10);

    coins.add(c);
  }

  // Enemies
  for(let i=0;i<6+realm*2;i++){

    const e=enemies.create(
      650+i*480,
      420,
      'enemy'
    );

    // Original working Silverback proportions
    e.setScale(.08);
    e.setDepth(8);

    if(e.body){
      e.body.setSize(
        e.width * .62,
        e.height * .82,
        true
      );
    }

    e.setVelocityX(
      i%2 ? r.enemySpeed : -r.enemySpeed
    );

    e.setBounce(1,0);
    e.setCollideWorldBounds(true);
  }

  // Portal
  portal=this.add.circle(
    4750,
    390,
    48,
    realm===4 ? 0xffdd00 : 0x00ffff
  );

  this.physics.add.existing(portal,true);

  this.tweens.add({
    targets:portal,
    scaleX:1.25,
    scaleY:1.25,
    alpha:.65,
    duration:650,
    yoyo:true,
    repeat:-1
  });

  // UI
  this.scoreText=this.add.text(
    20,20,
    '',
    {
      font:'bold 22px Arial',
      fill:'#ffffff',
      stroke:'#000',
      strokeThickness:5
    }
  ).setScrollFactor(0).setDepth(50);

  updateHud(this);
}

function updateHud(scene){

  if(!scene.scoreText) return;

  scene.scoreText.setText(
    `SCORE ${score}   HEALTH ${health}   COINS ${realmCoins}/15`
  );
}

function collectCoin(player,c){

  c.destroy();

  realmCoins++;
  score+=100;

  updateHud(this);
}

function hitEnemy(player,e){

  if(player._hurt) return;

  player._hurt=true;

  health--;

  updateHud(this);

  player.setTint(0xff5555);
  player.setVelocityY(-350);

  this.time.delayedCall(900,()=>{
    if(player){
      player.clearTint();
      player._hurt=false;
    }
  });

  if(health<=0){
    finishGame.call(this,false);
  }
}

function enterPortal(){

  if(gameOver) return;

  // require at least 10/15 coins
  if(realmCoins < 10){
    return;
  }

  score += 1000;

  if(realm < REALMS.length-1){

    realm++;

    this.scene.restart();

  }else{

    finishGame.call(this,true);
  }
}

function finishGame(win){

  if(gameOver) return;

  gameOver=true;

  this.physics.pause();

  const finalScore =
    score +
    (health*500) +
    (win?5000:0);

  this.add.rectangle(
    480,270,
    620,260,
    0x000000,.88
  )
  .setScrollFactor(0)
  .setDepth(100);

  this.add.text(
    480,220,
    win?'ALL REALMS COMPLETE':'GAME OVER',
    {
      font:'bold 34px Arial',
      fill:win?'#00ffc8':'#ff5577'
    }
  )
  .setOrigin(.5)
  .setScrollFactor(0)
  .setDepth(101);

  this.add.text(
    480,290,
    `FINAL SCORE ${finalScore}`,
    {
      font:'bold 26px Arial',
      fill:'#ffd700'
    }
  )
  .setOrigin(.5)
  .setScrollFactor(0)
  .setDepth(101);

  if(typeof arcadeSubmitScore==='function'){
    arcadeSubmitScore(
      'dino-realms',
      finalScore
    ).catch(console.error);
  }
}

function update(){

  if(!player || gameOver) return;

  const speed = 300 + realm*20;

  if(cursors.left.isDown || touchControls.left){

    player.setVelocityX(-speed);
    player.flipX=true;

  }else if(cursors.right.isDown || touchControls.right){

    player.setVelocityX(speed);
    player.flipX=false;

  }else{

    player.setVelocityX(0);
  }

  if(
    (cursors.up.isDown || touchControls.jump) &&
    player.body.blocked.down
  ){
    player.setVelocityY(-620);
    touchControls.jump=false;
  }

  enemies.children.iterate(e=>{

    if(!e || !e.body) return;

    if(
      e.body.blocked.left ||
      e.body.blocked.right
    ){
      e.setVelocityX(
        -e.body.velocity.x
      );
    }
  });
}
</script>

</body>
</html>
