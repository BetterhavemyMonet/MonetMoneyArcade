<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dino Realms</title>
<script src="wallet.js"></script>
<script src="https://api.betterhavemymonet.com/levels.js"></script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#090014;overflow:hidden}
canvas{display:block}
</style>
<script type="module" src="/analytics.js"></script>
</head>
<body>
<script>
showGameLobby('dino-realms', startGame);

function startGame(){

let game,player,cursors,portal,score=0,health=5,timeLeft=120;
let scoreText,healthText,timeText,coinsLeftText;
let invincible=false, coinsRemaining=50, gameEnded=false;

const config={
type:Phaser.AUTO,
width:window.innerWidth,
height:window.innerHeight,
physics:{default:'arcade',arcade:{gravity:{y:1000},debug:false}},
scene:{preload,create,update}
};

game=new Phaser.Game(config);

function preload(){
 this.load.image('dino','/dino-sprite.png');
 this.load.image('silverback','/silverback.png');
}

function create(){
 const W=this.scale.width,H=this.scale.height;

 this.physics.world.setBounds(0,0,6000,2000);
 this.cameras.main.setBounds(0,0,6000,2000);
 this.cameras.main.setBackgroundColor('#160020');

 for(let i=0;i<150;i++){
   this.add.circle(
     Phaser.Math.Between(0,6000),
     Phaser.Math.Between(0,1800),
     2,0xffffff,Math.random()
   );
 }

 const ground=this.physics.add.staticGroup();

 for(let i=0;i<15;i++){
   let p=this.add.rectangle(200+i*400,1750,400,70,0x4a257a);
   this.physics.add.existing(p,true);
   ground.add(p);
 }

 [
 [700,1300],[1200,1100],[1700,900],[2200,1200],
 [2800,900],[3300,700],[4000,1000],[4700,700],[5400,900]
 ].forEach(([x,y])=>{
   let p=this.add.rectangle(x,y,250,24,0x00ccaa);
   this.physics.add.existing(p,true);
   ground.add(p);
 });

 player=this.physics.add.sprite(150,1500,'dino');
 player.setScale(.35);
 player.setCollideWorldBounds(true);
 this.physics.add.collider(player,ground);

 this.cameras.main.startFollow(player,true,0.08,0.08);

 cursors=this.input.keyboard.createCursorKeys();

 const coins=this.physics.add.group();
 for(let i=0;i<50;i++){
   const c=coins.create(
     Phaser.Math.Between(200,5800),
     Phaser.Math.Between(300,1500)
   );
   c.visible=false;
   c.body.setSize(20,20);
   c.marker=this.add.circle(c.x,c.y,10,0xffd700);
 }

 this.physics.add.overlap(player,coins,(p,c)=>{
   c.marker.destroy();
   c.destroy();
   score+=10;
   coinsRemaining--;
   scoreText.setText('MONET: '+score);
   coinsLeftText.setText('LEFT: '+coinsRemaining);
   if(coinsRemaining===0){
      portal.fillColor=0x00ff00;
   }
 });

 const gorillas=this.physics.add.group();
 for(let i=0;i<12;i++){
   let g=gorillas.create(700+i*400,1500,'silverback');
   g.setScale(.08);
   g.direction=Math.random()>0.5?1:-1;
   g.speed=60;
   g.lastHit=0;
 }
 this.physics.add.collider(gorillas,ground);

 this.physics.add.overlap(player,gorillas,()=>{
   if(invincible||gameEnded) return;
   health--;
   healthText.setText('HEALTH: '+health);
   invincible=true;
   player.setAlpha(.4);
   setTimeout(()=>{invincible=false;player.setAlpha(1);},2000);
   if(health<=0) endGame(false,this);
 });

 portal=this.add.circle(5750,1450,40,0x00ffff);
 this.physics.add.existing(portal,true);

 this.physics.add.overlap(player,portal,()=>{
   if(coinsRemaining===0) endGame(true,this);
 });

 scoreText=this.add.text(20,20,'MONET: 0',{font:'24px Arial',fill:'#00ffcc'}).setScrollFactor(0);
 healthText=this.add.text(20,55,'HEALTH: 5',{font:'24px Arial',fill:'#ff6666'}).setScrollFactor(0);
 timeText=this.add.text(20,90,'TIME: 120',{font:'24px Arial',fill:'#ffffff'}).setScrollFactor(0);
 coinsLeftText=this.add.text(20,125,'LEFT: 50',{font:'24px Arial',fill:'#ffd700'}).setScrollFactor(0);

 this.time.addEvent({
   delay:1000, loop:true,
   callback:()=>{
     if(gameEnded) return;
     timeLeft--;
     timeText.setText('TIME: '+timeLeft);
     if(timeLeft<=0) endGame(false,this);
   }
 });

 this.events.on('update',()=>{
   gorillas.children.iterate(g=>{
     if(!g) return;
     let dist=Math.abs(player.x-g.x);
     if(dist<300){
       g.setVelocityX(player.x>g.x?120:-120);
     }else{
       g.setVelocityX(g.direction*g.speed);
       if(g.body.blocked.left||g.body.blocked.right){
         g.direction*=-1;
       }
     }
   });
 });

 function endGame(win,scene){
   if(gameEnded) return;
   gameEnded=true;

   let finalScore=score+(health*50)+(timeLeft*5)+(win?1000:0);

   scene.add.rectangle(player.x,player.y,600,300,0x000000,.8);
   scene.add.text(player.x-220,player.y-40,
      win?'REALM COMPLETE!':'GAME OVER',
      {font:'32px Arial',fill:'#00ffcc'});

   scene.add.text(player.x-220,player.y+10,
      'Final Score: '+finalScore,
      {font:'26px Arial',fill:'#ffd700'});

   setTimeout(()=>{
      arcadeSubmitScore('dino-realms',finalScore).catch(console.error);
   },2000);
 }
}

function update(){
 if(!player||gameEnded) return;

 const speed=300;

 if(cursors.left.isDown){
   player.setVelocityX(-speed);
   player.flipX=true;
 }else if(cursors.right.isDown){
   player.setVelocityX(speed);
   player.flipX=false;
 }else{
   player.setVelocityX(0);
 }

 if(cursors.up.isDown && player.body.blocked.down){
   player.setVelocityY(-650);
 }

 if(cursors.up.isDown && !player.body.blocked.down && player.body.velocity.y>0){
   player.setGravityY(-700);
   if(player.body.velocity.y>120) player.setVelocityY(120);
 }else{
   player.setGravityY(0);
 }

 if(player.y>2100){
   health=0;
 }
}
}
</script>

<script>
(() => {
function getPlayer(){return window.player||window.dino||window.hero;}
function getPlatforms(){return window.platforms||window.ground||[];}

function fix(){
  const p=getPlayer();
  const plats=getPlatforms();
  if(!p||!plats.length)return;

  const h=p.height||p.displayHeight||50;

  for(let i=0;i<plats.length;i++){
    const pl=plats[i];
    const py=pl.y??0;
    const px=pl.x??0;
    const pw=pl.width??9999;

    if(p.x+20>px && p.x<px+pw && p.y+h>=py && p.y+h<=py+30){
      p.y=py-h;
      p.velocityY=0;
      p.onGround=true;
    }
  }
}

function loop(){
  try{fix();}catch(e){}
  requestAnimationFrame(loop);
}

window.addEventListener("load",loop);
})();
</script>


<script>
(() => {
  const MonetRuntime = {
    tickRate: 2000,

    start() {
      setInterval(() => this.tick(), this.tickRate);
    },

    tick() {
      const player = window.player || window.dino || window.hero;

      if (!player) return;

      // -------------------------
      // PHYSICS SELF-HEAL
      // -------------------------
      const groundY = window.groundY || 0;
      const bottom = player.y + (player.height || 50);

      if (bottom > groundY + 20) {
        player.y = groundY - (player.height || 50);
        player.velocityY = 0;
        player.onGround = true;
      }

      // -------------------------
      // LEVEL SANITY CHECK
      // -------------------------
      if (window.MonetArcade?.state) {
        const s = window.MonetArcade.state;

        if (s.level < 1) s.level = 1;
        if (s.spawnRate < 100) s.spawnRate = 1000;
        if (isNaN(s.score)) s.score = 0;
      }

      // -------------------------
      // SPAWN SAFETY CHECK
      // -------------------------
      if (window.spawnObstacle && !window.__spawnSafe) {
        window.__spawnSafe = true;
      }
    }
  };

  window.MonetRuntime = MonetRuntime;
  window.addEventListener("load", () => MonetRuntime.start());
})();
</script>


<script id='MONET_RUNTIME_V4'>
(() => {
  const MONET_RUNTIME = {
    version: "4.0.0",

    state: {
      tick: 0,
      lastFix: 0
    },

    tickRate: 1500,

    start() {
      setInterval(() => this.tick(), this.tickRate);
    },

    tick() {
      this.state.tick++;

      const player = window.player || window.dino || window.hero;
      const arcade = window.MonetArcade?.state;

      // =========================
      // 1. PHYSICS REPAIR LAYER
      // =========================
      if (player) {
        const groundY = window.groundY || 0;
        const h = player.height || 50;
        const bottom = player.y + h;

        if (bottom > groundY + 20) {
          player.y = groundY - h;
          player.velocityY = 0;
          player.onGround = true;
          this.state.lastFix = Date.now();
        }
      }

      // =========================
      // 2. GAME STATE SANITIZER
      // =========================
      if (arcade) {
        if (!Number.isFinite(arcade.level)) arcade.level = 1;
        if (!Number.isFinite(arcade.score)) arcade.score = 0;
        if (!Number.isFinite(arcade.spawnRate)) arcade.spawnRate = 1000;

        // prevent Level 3-style lockups
        if (arcade.level < 1) arcade.level = 1;
        if (arcade.spawnRate < 200) arcade.spawnRate = 200;
      }

      // =========================
      // 3. SPAWN SAFETY GATE
      // =========================
      if (typeof window.spawnObstacle === "function") {
        window.__spawnSafe = true;
      }

      // =========================
      // 4. STABILITY WATCHDOG
      // =========================
      if (this.state.tick % 10 === 0) {
        this.healthCheck();
      }
    },

    healthCheck() {
      const player = window.player || window.dino;

      if (!player) return;

      // detect stuck state
      if (player.velocityY === 0 && player.onGround === false) {
        player.onGround = true;
      }
    }
  };

  window.MonetRuntime = MONET_RUNTIME;

  window.addEventListener("load", () => {
    MONET_RUNTIME.start();
  });
})();
</script>


<script id="MONET_TRANSCEND_V5">
(() => {
  const KernelBridge = {
    sync() {
      const arcade = window.MonetArcade?.state;
      if (!arcade) return;

      // register into kernel bridge
      window.__MONET_KERNEL_STATE = arcade;
    },

    fixPhysics() {
      const p = window.player || window.dino || window.hero;
      if (!p) return;

      const groundY = window.groundY || 0;
      const h = p.height || 50;

      const bottom = p.y + h;

      if (bottom > groundY + 20) {
        p.y = groundY - h;
        p.velocityY = 0;
        p.onGround = true;
      }
    },

    stabilizeGame() {
      const s = window.MonetArcade?.state;
      if (!s) return;

      if (!Number.isFinite(s.level)) s.level = 1;
      if (!Number.isFinite(s.score)) s.score = 0;

      // transcend rule: no unstable progression states
      if (s.level < 1) s.level = 1;
    }
  };

  function loop() {
    try {
      KernelBridge.sync();
      KernelBridge.fixPhysics();
      KernelBridge.stabilizeGame();
    } catch (e) {}

    requestAnimationFrame(loop);
  }

  window.addEventListener("load", loop);
})();
</script>


<script id="MONET_OS_V6">
(() => {

  const Runtime = {
    tick() {
      const player = window.player || window.dino || window.hero;
      const state = window.MonetArcade?.state;

      // -------------------------
      // PHYSICS CORRECTION
      // -------------------------
      if (player) {
        const ground = window.groundY || 0;
        const h = player.height || 50;

        if (player.y + h > ground + 20) {
          player.y = ground - h;
          player.velocityY = 0;
          player.onGround = true;
        }
      }

      // -------------------------
      // STATE SANITIZATION
      // -------------------------
      if (state) {
        if (!Number.isFinite(state.level)) state.level = 1;
        if (!Number.isFinite(state.score)) state.score = 0;
        if (!Number.isFinite(state.spawnRate)) state.spawnRate = 1000;

        if (state.level < 1) state.level = 1;
      }

      // -------------------------
      // SAFE HOOK GUARD
      // -------------------------
      if (typeof window.spawnObstacle === "function") {
        window.__MONET_SAFE = true;
      }
    }
  };

  function loop() {
    try { Runtime.tick(); } catch (e) {}
    requestAnimationFrame(loop);
  }

  window.addEventListener("load", loop);
})();
</script>
