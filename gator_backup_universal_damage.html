<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dino Realms</title>
<script src="wallet.js"></script>
<script src="https://api.betterhavemymonet.com/levels.js"></script>
<style>

#left{left:20px} #jump{left:110px} #right{left:200px}

<body>
<canvas id="game"></canvas>

<div id="levelIntro" style="
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
font-size:48px;
font-weight:bold;
color:white;
background:rgba(0,0,0,.55);
z-index:9998;
text-shadow:0 0 20px #fff;
">
LEVEL
</div>

<div id="victory" style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
z-index:99999;
color:white;
text-align:center;
padding-top:20vh;
font-family:Arial;
">
<h1>🦖 REALM COMPLETE 🦖</h1>
<h2 id="victoryScore"></h2>
<p>All MONET Crystals Collected</p>

padding:15px 30px;
font-size:20px;
border:none;
border-radius:12px;
">
Play Again
</button>

<div id="gameOver" style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
z-index:99999;
color:white;
text-align:center;
padding-top:20vh;
font-family:Arial;
">
<h1>💀 GAME OVER 💀</h1>
<h2 id="gameOverScore"></h2>
<button onclick="location.href='arcade.html'" style="padding:15px 30px;font-size:20px;border:none;border-radius:12px;">🏠 RETURN TO LOBBY</button>
</div>
<div id="hud">
MONET: <span id="score">0</span> | 💎 <span id="crystals">0</span>/20 | 🏆 <span id="best">0</span>
 | ❤ <span id="health">3</span>
 | BEST: <span id="best">0</span> | TIME: <span id="time">120</span> | LEVEL: <span id="level">1</span>
</div>
<button id="left" class="btn" ontouchstart="left=true" ontouchend="left=false" onmousedown="left=true" onmouseup="left=false">◀</button>
<button id="jump" class="btn" ontouchstart="jump=true" ontouchend="jump=false" onmousedown="jump=true" onmouseup="jump=false">▲</button>
<button id="right" class="btn" ontouchstart="right=true" ontouchend="right=false" onmousedown="right=true" onmouseup="right=false">▶</button>
<script>
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
function resize(){cvs.width=innerWidth;cvs.height=innerHeight} resize(); addEventListener('resize',resize);

const dino=new Image();
dino.src='assets/dino.png';
dino.onload=()=>console.log("DINO LOADED",dino.naturalWidth); dino.onerror=()=>console.log("DINO FAILED");

const crystal=new Image();
crystal.src='assets/crystal-v2.png';

const portalImg=new Image();
portalImg.src='assets/portal.png';
const bg=new Image();

function setLevelBackground(){
 if(level===1) bg.src='assets/bg-crystal-valley.png';
 else if(level===2) bg.src='assets/bg-emerald-jungle.png';
 else if(level===3) bg.src='assets/bg-frozen-peaks.png';
 else if(level===4) bg.src='assets/bg-magma-depths.png';
 else bg.src='assets/bg-portal-citadel.png';
}


const ape=new Image();
ape.src='assets/gorilla.png';

let score=0,timeLeft=120,started=false,health=3; let level=1;
setLevelBackground();

function showLevelIntro(){
 const names={
 1:'💎 CRYSTAL VALLEY',
 2:'🌴 EMERALD JUNGLE',
 3:'❄️ FROZEN PEAKS',
 4:'🌋 MAGMA DEPTHS',
 5:'🏰 PORTAL CITADEL'
 };
 const box=document.getElementById('levelIntro');
 box.textContent=names[level]||('LEVEL '+level);
 box.style.display='flex';
 setTimeout(()=>box.style.display='none',2000);
}

setTimeout(showLevelIntro,500);
let bestScore=parseInt(localStorage.getItem('dino_best')||'0');
document.getElementById("best").textContent=bestScore;
let left=false,right=false,jump=false,glide=false;

const player={
x:100,y:300,w:72,h:72,
vx:0,vy:0,
ground:false,
jumps:0,
maxJumps:2,
hurtUntil:0
};
const coins=[...Array(20)].map((_,i)=>({x:300+i*180,y:250+((i%3)*60),alive:true}));
const iceHazards=[];
const lavaHazards=[];
const rockHazards=[];
const branchHazards=[];
const enemyRocks=[];

const enemies=[{x:400,y:348,dir:1,type:"basic",attackTimer:0},{x:1200,y:348,dir:1,type:"thrower",attackTimer:0},{x:2000,y:348,dir:1,type:"charger",attackTimer:0},{x:2800,y:348,dir:1,type:"basic",attackTimer:0},{x:3600,y:348,dir:1,type:"heavy",attackTimer:0}];
const portal={x:4200,y:300,w:80,h:120,active:false};


const LEVEL_PLATFORMS={
1:[
{x:600,y:300,w:180,h:20},
{x:1100,y:290,w:180,h:20},
{x:1700,y:300,w:180,h:20},
{x:2400,y:300,w:180,h:20}
],
2:[
{x:500,y:340,w:120,h:20},
{x:850,y:270,w:120,h:20},
{x:1200,y:220,w:120,h:20},
{x:1600,y:300,w:120,h:20},
{x:2100,y:250,w:120,h:20}
],
3:[
{x:700,y:260,w:120,h:20},
{x:1050,y:180,w:120,h:20},
{x:1450,y:240,w:120,h:20},
{x:1850,y:170,w:120,h:20},
{x:2250,y:240,w:120,h:20}
],
4:[
{x:800,y:320,w:100,h:20},
{x:1400,y:260,w:100,h:20},
{x:2100,y:220,w:100,h:20},
{x:2800,y:180,w:100,h:20}
],
5:[
{x:500,y:280,w:100,h:20},
{x:800,y:220,w:100,h:20},
{x:1100,y:180,w:100,h:20},
{x:1400,y:220,w:100,h:20},
{x:1700,y:280,w:100,h:20},
{x:2100,y:180,w:100,h:20}
]
};


const platforms=[
{x:350,y:340,w:120,h:20},
{x:600,y:300,w:180,h:20},
{x:850,y:240,w:140,h:20},
{x:1100,y:290,w:180,h:20},
{x:1450,y:180,w:160,h:20},
{x:1700,y:300,w:180,h:20},
{x:2100,y:220,w:150,h:20},
{x:2400,y:300,w:180,h:20},
{x:2800,y:180,w:180,h:20},
{x:3200,y:290,w:180,h:20},
{x:3600,y:220,w:150,h:20},
{x:4000,y:180,w:180,h:20}
];

function startGame(){
 started=true;
 setInterval(()=>{
  timeLeft--;
  document.getElementById("time").textContent=timeLeft;
  if(timeLeft<=0) finish(false);
 },1000);
 requestAnimationFrame(loop);
}

if(typeof showGameLobby==='function'){
 showGameLobby('gator', startGame);
}else{
 startGame();
}

function finish(win){
 started=false;

 const crystalBonus=score*250;
 const finalScore=score*100+timeLeft*10+crystalBonus+(score>=20?5000:0);

 if(finalScore>bestScore){
  bestScore=finalScore;
  localStorage.setItem('dino_best',bestScore);
 }

 if(typeof arcadeSubmitScore==='function'){
  arcadeSubmitScore('gator',finalScore).catch(console.error);
 }

 if(win){

  if(level<5){
    level++;
    document.getElementById('level').textContent=level; setLevelBackground(); showLevelIntro();

    player.x=100;
    player.y=300;

    enemies.forEach((e,i)=>{
      e.dead=false;
      e.x=400+(i*700)+(level*150);
      e.dir=Math.random()>0.5?1:-1;
    });

    if(level>=2 && enemies.length<8){
      enemies.push({x:5200,y:348,dir:1});
      enemies.push({x:5800,y:348,dir:-1});
      enemies.push({x:6400,y:348,dir:1});
    }

    coins.forEach((c,i)=>{
      c.alive=true;
      c.x=300+(i*180)+(level*250);
    });

    portal.x=5200+(level*700);

    platforms.length=0;
    platforms.push(...LEVEL_PLATFORMS[level]);

    if(level===1){
      window.skyColor='#12001f';
      window.platformColor='#00ccaa';
      window.groundColor='#3b245f';
      window.mountainColor='#24143f';
    }

    if(level===2){
      window.skyColor='#002b12';
      window.groundColor='#3b2a18';
      window.platformColor='#22dd55';
      window.mountainColor='#014d20';
    }

    if(level===3){
      window.groundColor='#b8eaff';
      window.skyColor='#002244';
      window.platformColor='#88ddff';
      window.mountainColor='#113366';
    }

      window.groundColor='#1a1010';
    if(level===4){
      window.skyColor='#330000';
      window.platformColor='#ff6600';
      window.mountainColor='#661100';
    }
      window.groundColor='#16002b';

    if(level===5){
      window.skyColor='#000000';
      window.platformColor='#bb66ff';
      window.mountainColor='#220044';
    }

    started=true;
    return;
  }

  document.getElementById('victory').style.display='block';
  document.getElementById('victoryScore').textContent=
   'Score: '+finalScore+
   ' | Crystals: '+score+'/20'+
   (score>=20?' | PERFECT +5000':'');
 }else{
  const go=document.getElementById('gameOver');
  if(go){
    go.style.display='block';
    go.innerHTML=`
      <h1>GAME OVER</h1>
      <p>Score: ${finalScore}</p>
      <button onclick="location.href='arcade.html'">🏠 RETURN TO LOBBY</button>
    `;
  }else{
    alert('GAME OVER\nScore: '+finalScore);
  }
 }
}

['left','right','jump'].forEach(id=>{
 const el=document.getElementById(id);
 const press=(e)=>{console.log("BUTTON",id);e.preventDefault();if(id=="left")left=true;else if(id=="right")right=true;else if(id=="jump")jump=true;};
 const release=(e)=>{e.preventDefault();if(id=="left")left=false;else if(id=="right")right=false;else if(id=="jump")jump=false;};
 el.addEventListener("pointerdown",press);
 el.addEventListener("pointerup",release);
 el.addEventListener("pointerleave",release);
 el.addEventListener("pointercancel",release);
 el.addEventListener("touchstart",press,{passive:false});
 el.addEventListener("touchend",release,{passive:false});
 el.addEventListener("touchcancel",release,{passive:false});
});

addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft') left=true;
 if(e.key==='ArrowRight') right=true;
 if(e.key==='ArrowUp') jump=true;
});
addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft') left=false;
 if(e.key==='ArrowRight') right=false;
 if(e.key==='ArrowUp') jump=false;
});

function loop(){
 if(!started)return;
 
if(level===3 && Math.random()<0.04){
 iceHazards.push({x:player.x+300+Math.random()*800,y:-20,vy:8});
}

if(level===2 && Math.random()<0.25){
 branchHazards.push({x:player.x+300+Math.random()*900,y:-30,vy:6+Math.random()*3});
}

if(level===4 && Math.random()<0.05){
 lavaHazards.push({x:player.x+300+Math.random()*1000,timer:80});
 
if((level===2||level===4) && Math.random()<0.04){
 rockHazards.push({x:player.x+400+Math.random()*900,y:-20,vy:5+Math.random()*4});
}
}

iceHazards.forEach(i=>{
 i.y+=i.vy;
 if(i.y>500)i.dead=true;
});

for(let n=iceHazards.length-1;n>=0;n--){
 if(iceHazards[n].dead)iceHazards.splice(n,1);
}

lavaHazards.forEach(l=>{
 
rockHazards.forEach(r=>{
 
 if(Math.abs(player.x-r.x)<100 && Math.abs(player.y-r.y)<100){
  player.hurtUntil=Date.now()+500;
  health=Math.max(0,health-1);document.getElementById('health').textContent=health;console.log('HIT',health);
  r.dead=true;
 }
 r.y+=r.vy;
 if(r.y>500)r.dead=true;
});
for(let n=rockHazards.length-1;n>=0;n--){
 if(rockHazards[n].dead)rockHazards.splice(n,1);
}
 l.timer--;
 if(l.timer<=0)l.dead=true;
});

for(let n=lavaHazards.length-1;n>=0;n--){
 if(lavaHazards[n].dead)lavaHazards.splice(n,1);
}

 const speed=6;

if(left){
 player.vx=Math.max(player.vx-0.7,-speed);
}else if(right){
 player.vx=Math.min(player.vx+0.7,speed);
}else{
 player.vx*=0.85;
}

player.x+=player.vx;
 
const now=Date.now();

iceHazards.forEach(i=>{
 if(now>(player.hurtUntil||0) && Math.abs(player.x-i.x)<100 && Math.abs(player.y-i.y)<100){
  health=Math.max(0,health-1);document.getElementById('health').textContent=health;console.log('HIT',health);
  player.hurtUntil=now+1000;
  i.dead=true;
 }
});

rockHazards.forEach(r=>{
 if(now>(player.hurtUntil||0) && Math.abs(player.x-r.x)<100 && Math.abs(player.y-r.y)<100){
  health=Math.max(0,health-1);document.getElementById('health').textContent=health;console.log('HIT',health);
  player.hurtUntil=now+1000;
  r.dead=true;
 }
});

branchHazards.forEach(b=>{
 if(now>(player.hurtUntil||0) && Math.abs(player.x-b.x)<100 && Math.abs(player.y-b.y)<100){
  health=Math.max(0,health-1);
  document.getElementById("health").textContent=health;
  console.log("HIT",health);
  player.hurtUntil=now+1000;
  b.dead=true;
 }
});

lavaHazards.forEach(l=>{
 if(now>(player.hurtUntil||0) && l.timer>40 && Math.abs(player.x-l.x)<60 && player.y>240){
  health=Math.max(0,health-1);document.getElementById('health').textContent=health;console.log('HIT',health);
  player.hurtUntil=now+1000;
 }
});

if(health<=0) finish(false);

if(jump && !player.jumpLock){

 if(player.ground){
  player.vy=-13;
  player.jumps=1;
  player.ground=false;
 }
 else if(player.jumps<player.maxJumps){
  player.vy=-12;
  player.jumps++;
 }

 player.jumpLock=true;
}

if(!jump) player.jumpLock=false;
 if(jump && !player.ground && player.vy>0){
   player.vy+=0.05;
  ctx.shadowBlur=0;
 }else{
   player.vy+=0.6;
 }
 player.y+=player.vy;

 if(player.y>340){player.y=340;player.vy=0;player.ground=true;
player.jumps=0;}

 platforms.forEach(p=>{
   if( player.x+player.w > p.x &&
       player.x < p.x+p.w &&
       player.y+player.h > p.y &&
       player.y+player.h < p.y+25 &&
       player.vy >= 0 ){
     player.y = p.y-player.h;
     player.vy = 0;
     player.ground = true;
player.jumps=0;
   }
 });

 coins.forEach(c=>{
  if(c.alive && Math.abs(player.x-c.x)<40 && Math.abs(player.y-c.y)<40){
    c.alive=false; score++; player.vy=-2; player.vy=-2; document.getElementById('score').textContent=score;document.getElementById('crystals').textContent=score;
    portal.active=true;
  }
 });


  enemyRocks.forEach(r=>{
    r.x+=r.vx;
    r.y+=r.vy;
    r.vy+=0.25;
    if(r.y>500)r.dead=true;

    if(now>(player.hurtUntil||0) && Math.abs(player.x-r.x)<40 && Math.abs(player.y-r.y)<40){
      health=Math.max(0,health-1);
      document.getElementById("health").textContent=health;
      console.log("GORILLA ROCK HIT",health);
      player.hurtUntil=now+1000;
      r.dead=true;
    }
  });

  for(let n=enemyRocks.length-1;n>=0;n--){
    if(enemyRocks[n].dead)enemyRocks.splice(n,1);
  }
enemies.forEach(e=>{

  if(e.dead)return;

  e.x+=e.dir*2;

    if(e.type==="thrower"){
      e.attackTimer=(e.attackTimer||0)-1;
      if(e.attackTimer<=0 && Math.abs(player.x-e.x)<450){
        enemyRocks.push({
          x:e.x,
          y:e.y+20,
          vx:player.x>e.x?6:-6,
          vy:-8,
          enemy:true
        });
        e.attackTimer=120;
      }
    }
  if(e.x<200||e.x>4300)e.dir*=-1;

  if(Math.abs(player.x-e.x)<80 && Math.abs(player.y-e.y)<90){

    if(
      player.vy>0 &&
      player.y+player.h<e.y+80
    ){
      e.dead=true;
      player.vy=-10;
      score+=5;
      document.getElementById("score").textContent=score;
      return;
    }

    if(!e.hit){
      e.hit=true;
      score=Math.max(0,score-1);
      document.getElementById("score").textContent=score;
      setTimeout(()=>e.hit=false,1000);
    }
  }
});

 if(portal.active && Math.abs(player.x-portal.x)<60) finish(true);

 try{draw();}catch(e){alert(e.message);console.error(e);}
 requestAnimationFrame(loop);
}

function draw(){
 const cam=Math.max(0,player.x-cvs.width/2);
 if(bg.complete && bg.naturalWidth > 0){ctx.drawImage(bg,-cam*0.15,0,5000,cvs.height);}else{ctx.fillStyle='#12001f';ctx.fillRect(-10000,-10000,50000,50000);}

 for(let i=0;i<12;i++){
 ctx.fillStyle=(window.mountainColor||'#24143f');
 ctx.beginPath();
 ctx.moveTo(i*700-(cam*0.25),412);
 ctx.lineTo(i*700+250-(cam*0.25),120);
 ctx.lineTo(i*700+500-(cam*0.25),412);
 ctx.fill();
}

  ctx.fillStyle=(window.groundColor||"#4a257a");
  ctx.fillRect(-cam,412,10000,cvs.height);
      platforms.forEach(p=>{
       let body=window.platformColor||"#00ccaa";
       let cap=window.groundColor||"#4a257a";
       if(level===2){body="#4b2e18";cap="#3fa34d";}
       if(level===3){body="#5bbde8";cap="#e8f8ff";}
       if(level===4){body="#2b1b1b";cap="#ff6600";}
       if(level===5){body="#2a1245";cap="#bb66ff";}
       ctx.fillStyle=body;
       ctx.fillRect(p.x-cam,p.y,p.w,p.h);
       ctx.fillStyle=cap;
       ctx.fillRect(p.x-cam,p.y,p.w,5);
      });

coins.forEach(c=>{
 if(!c.alive)return;
 const bob=Math.sin(Date.now()/200+c.x)*5;
 if(crystal.complete){
  ctx.shadowBlur=15;
  ctx.shadowColor='#66ffff';
  if(crystal.complete && crystal.naturalWidth > 0) ctx.drawImage(crystal,c.x-cam-18,c.y-22+bob,48,58);
 }else{
  ctx.fillStyle="gold";
  ctx.beginPath();
  ctx.arc(c.x-cam,c.y,10,0,Math.PI*2);
  ctx.fill();
 }
});



  enemyRocks.forEach(r=>{
    ctx.fillStyle="#6b4f2a";
    ctx.beginPath();
    ctx.arc(r.x-cam,r.y,10,0,Math.PI*2);
    ctx.fill();
  });
enemies.forEach(e=>{

  if(e.dead)return;

  if(ape.complete){
    if(ape.complete && ape.naturalWidth > 0) ctx.drawImage(ape,e.x-cam-15,e.y+35,110,110);
  }else{
    ctx.fillStyle="red";
    ctx.fillRect(e.x-cam,e.y,64,64);
  }
});

 if(true){
   ctx.strokeStyle='#00ffcc'; ctx.lineWidth=4;
   if(portalImg.complete){
 iceHazards.forEach(i=>{
 ctx.fillStyle='#aeefff';
 ctx.beginPath();
 ctx.arc(i.x-cam,i.y,10,0,Math.PI*2);
 ctx.fill();
});

lavaHazards.forEach(l=>{
 
rockHazards.forEach(r=>{
 
 if(Math.abs(player.x-r.x)<100 && Math.abs(player.y-r.y)<100){
  player.hurtUntil=Date.now()+500;
  
  r.dead=true;
 }
 r.y+=r.vy;
 if(r.y>500)r.dead=true;
});
for(let n=rockHazards.length-1;n>=0;n--){
 if(rockHazards[n].dead)rockHazards.splice(n,1);
}
 if(l.timer>40){
  ctx.fillStyle='#ff6600';
  ctx.fillRect(l.x-cam-20,220,40,180);
 }
});

 
rockHazards.forEach(r=>{
 
 if(Math.abs(player.x-r.x)<100 && Math.abs(player.y-r.y)<100){
  player.hurtUntil=Date.now()+500;
  
  r.dead=true;
 }
 ctx.fillStyle="#555";
 ctx.beginPath();
 ctx.arc(r.x-cam,r.y,8,0,Math.PI*2);
 ctx.fill();
});

 branchHazards.forEach(b=>{
  ctx.fillStyle="#8b4513";
  ctx.save();
  ctx.translate(b.x-cam,b.y);
  ctx.rotate(0.4);
  ctx.fillRect(-25,-5,50,10);
  ctx.fillRect(0,-15,8,20);
  ctx.restore();
 });
ctx.shadowBlur=30;
 ctx.shadowColor='#00ffff';
 if(portalImg.complete && portalImg.naturalWidth > 0) ctx.drawImage(portalImg,portal.x-cam-40,portal.y-40,220,220);
 ctx.shadowBlur=0;
}
 }

 if(dino.complete && dino.naturalWidth > 0) ctx.drawImage(dino,player.x-cam,player.y+55,player.w,player.h);
 else {ctx.fillStyle='lime';ctx.fillRect(player.x-cam,player.y-16,player.w,player.h);}
}
</script>

<script>
(() => {
function getPlayer(){return window.player||window.dino||window.hero;}
function getPlatforms(){return window.platforms||window.ground||[];}

function fix(){
  const p=getPlayer();
  const plats=getPlatforms();
  if(!p||!plats.length)return;

  const h=p.height||p.displayHeight||50;

  for(let i=0;i<plats.length;i++){
    const pl=plats[i];
    const py=pl.y??0;
    const px=pl.x??0;
    const pw=pl.width??9999;

    if(p.x+20>px && p.x<px+pw && p.y+h>=py && p.y+h<=py+30){
      p.y=py-h;
      p.velocityY=0;
      p.onGround=true;
    }
  }
}

function loop(){
  try{fix();}catch(e){}
  requestAnimationFrame(loop);
}

window.addEventListener("load",loop);
})();
</script>

<script id='MONET_RUNTIME_V4'>
(() => {
  const MONET_RUNTIME = {
    version: "4.0.0",

    state: {
      tick: 0,
      lastFix: 0
    },

    tickRate: 1500,

    start() {
      setInterval(() => this.tick(), this.tickRate);
    },

    tick() {
      this.state.tick++;

      const player = window.player || window.dino || window.hero;
      const arcade = window.MonetArcade?.state;

      // =========================
      // 1. PHYSICS REPAIR LAYER
      // =========================
      if (player) {
        const groundY = window.groundY || 0;
        const h = player.height || 50;
        const bottom = player.y + h;

        if (bottom > groundY + 20) {
          player.y = groundY - h;
          player.velocityY = 0;
          player.onGround = true;
          this.state.lastFix = Date.now();
        }
      }

      // =========================
      // 2. GAME STATE SANITIZER
      // =========================
      if (arcade) {
        if (!Number.isFinite(arcade.level)) arcade.level = 1;
        if (!Number.isFinite(arcade.score)) arcade.score = 0;
        if (!Number.isFinite(arcade.spawnRate)) arcade.spawnRate = 1000;

        // prevent Level 3-style lockups
        if (arcade.level < 1) arcade.level = 1;
        if (arcade.spawnRate < 200) arcade.spawnRate = 200;
      }

      // =========================
      // 3. SPAWN SAFETY GATE
      // =========================
      if (typeof window.spawnObstacle === "function") {
        window.__spawnSafe = true;
      }

      // =========================
      // 4. STABILITY WATCHDOG
      // =========================
      if (this.state.tick % 10 === 0) {
        this.healthCheck();
      }
    },

    healthCheck() {
      const player = window.player || window.dino;

      if (!player) return;

      // detect stuck state
      if (player.velocityY === 0 && player.onGround === false) {
        player.onGround = true;
      }
    }
  };

  window.MonetRuntime = MONET_RUNTIME;

  window.addEventListener("load", () => {
    MONET_RUNTIME.start();
  });
})();
</script>


<script id="MONET_TRANSCEND_V5">
(() => {
  const KernelBridge = {
    sync() {
      const arcade = window.MonetArcade?.state;
      if (!arcade) return;

      // register into kernel bridge
      window.__MONET_KERNEL_STATE = arcade;
    },

    fixPhysics() {
      const p = window.player || window.dino || window.hero;
      if (!p) return;

      const groundY = window.groundY || 0;
      const h = p.height || 50;

      const bottom = p.y + h;

      if (bottom > groundY + 20) {
        p.y = groundY - h;
        p.velocityY = 0;
        p.onGround = true;
      }
    },

    stabilizeGame() {
      const s = window.MonetArcade?.state;
      if (!s) return;

      if (!Number.isFinite(s.level)) s.level = 1;
      if (!Number.isFinite(s.score)) s.score = 0;

      // transcend rule: no unstable progression states
      if (s.level < 1) s.level = 1;
    }
  };

  function loop() {
    try {
      KernelBridge.sync();
      KernelBridge.fixPhysics();
      KernelBridge.stabilizeGame();
    } catch (e) {}

    requestAnimationFrame(loop);
  }

  window.addEventListener("load", loop);
})();
</script>
