services:
  - type: web
    name: monet-money-arcade
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/shop/items

    envVars:
      - key: NODE_VERSION
        value: 22

      - key: PORT
        value: 10000

      - key: SOLANA_RPC_URL
        sync: false

      - key: MINT_ADDRESS
        sync: false

      - key: TREASURY_ADDRESS
        sync: false

      - key: TREASURY_PRIVATE_KEY
        sync: false

      - key: STRIPE_SECRET_KEY
        sync: false

      - key: STRIPE_PUBLISHABLE_KEY
        sync: false

      - key: STRIPE_WEBHOOK_SECRET
        sync: false
